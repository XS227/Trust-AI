name: TrustAI B2B Partner Network checks
on:
  push:
    branches:
      - feature/b2b-partner-network-*
  pull_request:
    paths:
      - 'api/partner-network/**'
      - 'partner-network.html'
      - 'api/auth/vipps/**'
      - 'database/migrations/2026-11-17_b2b_partner_network.sql'
      - 'database/seeds/2026-11-17_setaei_rawscales_stenhuset.sql'
      - '.github/workflows/b2b-partner-lint.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax validation
        run: |
          php -l api/partner-network/index.php
          php -l api/auth/vipps/login.php
          php -l api/auth/vipps/callback.php
          php -l api/auth/vipps/set-role.php
      - name: JavaScript syntax validation
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('partner-network.html','utf8');
          const js = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!js) throw new Error('Inline script not found');
          new vm.Script(js[1], {filename:'partner-network-inline.js'});
          console.log('Partner Network inline JavaScript syntax OK');
          NODE

  schema:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: trustai_ci_only
          MARIADB_DATABASE: trustai_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Install MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
      - name: Apply B2B schema and duplicate-safe RAWScales bootstrap
        env:
          MYSQL_PWD: trustai_ci_only
        run: |
          mariadb --skip-ssl -h127.0.0.1 -uroot trustai_ci < database/migrations/2026-11-17_b2b_partner_network.sql
          mariadb --skip-ssl -h127.0.0.1 -uroot trustai_ci < database/seeds/2026-11-17_setaei_rawscales_stenhuset.sql
          mariadb --skip-ssl -h127.0.0.1 -uroot trustai_ci < database/seeds/2026-11-17_setaei_rawscales_stenhuset.sql
          COUNT=$(mariadb --skip-ssl -h127.0.0.1 -uroot trustai_ci --batch --skip-column-names -e "SELECT COUNT(*) FROM b2b_reserved_referrals WHERE org_number='992214341' AND approval_status='approved' AND partner_label='RAWScales / Thomas Hannaas' AND suggested_fixed_commission=3000.00;")
          test "$COUNT" = "1"
          USER_COUNT=$(mariadb --skip-ssl -h127.0.0.1 -uroot trustai_ci --batch --skip-column-names -e "SELECT COUNT(*) FROM b2b_partners;")
          test "$USER_COUNT" = "0"
          PAY_COUNT=$(mariadb --skip-ssl -h127.0.0.1 -uroot trustai_ci --batch --skip-column-names -e "SELECT COUNT(*) FROM b2b_commissions;")
          test "$PAY_COUNT" = "0"
          echo "Approved reservation exists once; no fake Vipps user and no payable commission."
