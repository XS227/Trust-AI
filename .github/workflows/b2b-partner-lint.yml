name: TrustAI B2B Partner Network checks
on:
  push:
    branches:
      - feature/b2b-partner-network-*
  pull_request:
    paths:
      - 'api/partner-network/**'
      - 'partner-network.html'
      - 'api/auth/vipps/**'
      - 'database/migrations/2026-11-17_b2b_partner_network.sql'
      - '.github/workflows/b2b-partner-lint.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax validation
        run: |
          php -l api/partner-network/index.php
          php -l api/auth/vipps/login.php
          php -l api/auth/vipps/callback.php
          php -l api/auth/vipps/set-role.php
      - name: JavaScript syntax validation
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('partner-network.html','utf8');
          const js = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!js) throw new Error('Inline script not found');
          new vm.Script(js[1], {filename:'partner-network-inline.js'});
          console.log('Partner Network inline JavaScript syntax OK');
          NODE
